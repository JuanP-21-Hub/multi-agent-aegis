services:
  database:
    image: postgres:17-alpine
    container_name: finlab-db

    environment:
      POSTGRES_DB: banklab
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - bank_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d banklab"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - bank_internal

  backend:
    build: ./backend
    container_name: finlab-api

    environment:
      DB_HOST: database
      DB_NAME: banklab
      DB_USER: bank_admin
      DB_PASSWORD: ${DB_PASSWORD}
      RRN_ENCRYPTION_KEY: ${RRN_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - bank_internal
      - client_local

networks:
  bank_internal:
    internal: true

  client_local:

volumes:
  bank_data:
