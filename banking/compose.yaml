services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banklab
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - bank_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_admin -d banklab"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [bank_internal]
  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: database
      PGDATABASE: banklab
      PGUSER: bank_admin
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_integration.sql", "-f", "/migrations/002_finlab_blue.sql"]
    depends_on:
      database:
        condition: service_healthy
    networks: [bank_internal]
    restart: "no"
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: banklab
      DB_USER: bank_admin
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RRN_ENCRYPTION_KEY: ${RRN_ENCRYPTION_KEY:?Keep the original Fernet key for existing DBs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LAB_MODE: ${LAB_MODE:-fixed}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/db')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bank_internal, client_local]
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [client_local]
networks:
  bank_internal:
    internal: true
  client_local:
volumes:
  bank_data:
